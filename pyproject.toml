[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiknow"
version = "0.1.0"
description = "个人知识库与知识图谱"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "setuptools>=68"]
pdf = ["pymupdf>=1.28"]
docx = ["python-docx>=1.2"]
docling = ["docling>=2.150"]

[project.scripts]
aiknow = "aiknow.__main__:main"

[tool.setuptools]
packages = ["aiknow", "ingest", "pipeline", "retrieval"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
